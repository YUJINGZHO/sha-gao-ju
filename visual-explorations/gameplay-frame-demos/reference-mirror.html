<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>可爱杀糕局 · Reference Gameplay Demo</title>
  <style>
    :root { color-scheme: light; --ink: #825653; --muted: #a77470; --rose: #bb6b79; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #f3dfda; }
    .screen { position: relative; width: 100vw; height: 100dvh; min-height: 520px; overflow: hidden; isolation: isolate; }
    .artboard { position: absolute; inset: 0; z-index: -1; background: #f6e9e1 url('./assets/reference-match-landscape.png') center / cover no-repeat; }
    .artboard::after { position: absolute; inset: 0; content: ""; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(131,76,74,.08)); }
    .hud { position: absolute; top: 14.7%; left: 50%; z-index: 2; display: grid; width: min(41vw, 650px); grid-template-columns: 1fr 1fr 1fr; align-items: start; color: var(--ink); text-align: center; transform: translateX(-50%); text-shadow: 0 1px 0 rgba(255,255,255,.9); }
    .hud-block { display: grid; gap: 7px; }
    .hud-label { color: var(--muted); font: 10px/1 Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    .hud-value { font: 500 clamp(24px, 3.3vw, 44px)/.9 Georgia, "Times New Roman", serif; font-variant-numeric: tabular-nums; }
    .hearts { color: var(--rose); font: clamp(22px, 3vw, 39px)/.86 Georgia, serif; letter-spacing: .12em; white-space: nowrap; }
    .combo { position: absolute; top: 66%; left: 50%; z-index: 2; color: #aa626d; text-align: center; text-shadow: 0 1px 0 rgba(255,255,255,.94); transform: translate(-50%, -50%) rotate(-3deg); }
    .combo::before, .combo::after { position: absolute; top: 57%; width: clamp(42px, 6vw, 92px); height: 18px; border-top: 1px solid rgba(185, 107, 120, .7); border-radius: 50%; content: ""; }
    .combo::before { right: calc(100% + 14px); transform: rotate(-8deg); }
    .combo::after { left: calc(100% + 14px); transform: scaleX(-1) rotate(-8deg); }
    .combo strong { display: block; font: italic 500 clamp(30px, 4.5vw, 62px)/.9 Georgia, "Times New Roman", serif; }
    .combo small { display: block; margin-top: 5px; color: var(--muted); font: 13px/1 Arial, sans-serif; letter-spacing: .12em; }
    .sparkles { position: absolute; inset: -22px -40px; pointer-events: none; color: #d58b98; font: 19px/1 Georgia, serif; }
    .sparkles span { position: absolute; }
    .sparkles span:nth-child(1) { top: 4px; left: 8px; }
    .sparkles span:nth-child(2) { top: 20px; right: 10px; font-size: 15px; }
    .sparkles span:nth-child(3) { bottom: 0; left: 30%; font-size: 14px; }
    .tutorial { position: absolute; bottom: 14%; left: 50%; z-index: 2; display: flex; align-items: center; gap: 13px; color: #98645f; font: 15px/1 Arial, sans-serif; letter-spacing: .01em; text-shadow: 0 1px 0 rgba(255,255,255,.9); transform: translateX(-50%); white-space: nowrap; }
    .tutorial::before, .tutorial::after { width: clamp(38px, 5vw, 78px); height: 11px; border-top: 1px solid rgba(182, 102, 103, .65); border-radius: 50%; content: ""; }
    .tutorial::after { transform: scaleX(-1); }
    .ribbon { position: absolute; bottom: 9.2%; left: 50%; z-index: 2; width: 30px; height: 14px; transform: translateX(-50%); }
    .ribbon::before, .ribbon::after { position: absolute; top: 0; width: 21px; height: 13px; border-radius: 80% 20% 80% 20%; content: ""; background: #df9daa; box-shadow: 0 1px 0 rgba(174, 87, 101, .35); }
    .ribbon::before { right: 11px; transform: rotate(18deg); }
    .ribbon::after { left: 11px; transform: scaleX(-1) rotate(18deg); }
    .demo-label { position: fixed; right: 18px; bottom: 13px; z-index: 3; color: rgba(118, 70, 67, .66); font: 9px/1 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    @media (max-width: 700px) {
      .artboard { background-image: url('./assets/reference-match-portrait.png'); background-position: center; }
      .hud { top: 14.2%; width: 58vw; min-width: 230px; }
      .hud-label { font-size: 8px; letter-spacing: .12em; }
      .hud-value { font-size: clamp(20px, 6vw, 30px); }
      .hearts { font-size: clamp(18px, 5.5vw, 27px); letter-spacing: .06em; }
      .combo { top: 63%; }
      .combo strong { font-size: clamp(28px, 9vw, 42px); }
      .combo small { font-size: 10px; }
      .tutorial { bottom: 11.5%; font-size: 11px; gap: 8px; }
      .tutorial::before, .tutorial::after { width: 25px; }
      .ribbon { bottom: 7.2%; }
      .demo-label { right: 8px; bottom: 7px; font-size: 7px; }
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="可爱杀糕局参考图方向 Gameplay Demo">
    <div class="artboard" aria-hidden="true"></div>
    <div class="hud" aria-label="score time lives">
      <div class="hud-block"><span class="hud-label">score</span><strong class="hud-value">430</strong></div>
      <div class="hud-block"><span class="hud-label">time</span><strong class="hud-value">42s</strong></div>
      <div class="hud-block"><span class="hud-label">lives</span><strong class="hearts">♥ ♥ ♥</strong></div>
    </div>
    <div class="combo"><div class="sparkles" aria-hidden="true"><span>✦</span><span>✧</span><span>✦</span></div><strong>Nice!</strong><small>一刀三糕　×3</small></div>
    <div class="tutorial">Swipe to slice the cakes</div>
    <div class="ribbon" aria-hidden="true"></div>
    <span class="demo-label">responsive reference demo</span>
  </main>
</body>
</html>
